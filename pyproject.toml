[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
description = "SPECTRA — unified vendor-agnostic DVR/NVR forensic analysis platform (SIH26150)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    # Report templating (doc 3 §13, FR-80, FR-87). Pure Python, BSD-3-Clause, no native
    # dependencies — safe for the offline single-file bundle (NFR-07, NFR-15, NFR-16).
    "jinja2>=3.1",
]

[project.optional-dependencies]
# E01/Ex01 ingest (FR-17). libewf is LGPL-3.0, used as a dynamically loaded extension.
ewf = ["libewf-python>=20240506"]
# PDF/A rendering (doc 3 §10). Kept optional because WeasyPrint needs cairo and pango at
# the system level, which CI and the minimum-spec VM should not have to carry to run the
# rest of the suite. Without it `spectra report generate` still produces the HTML and says
# plainly that the PDF step was skipped — it never silently emits a lesser artefact.
pdf = ["weasyprint>=62"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
spectra = "spectra.cli:main"

[tool.setuptools.dynamic]
version = { attr = "spectra.__version__" }

[tool.setuptools.packages.find]
include = ["spectra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ffmpeg: needs an FFmpeg binary (SPECTRA_FFMPEG or PATH); skipped with notice otherwise",
    "ewf: needs pyewf (libewf-python); skipped with notice otherwise",
    "pdf: needs WeasyPrint and its native libs; skipped with notice otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert is how pytest works
    "S603",   # subprocess without shell — FFmpeg is invoked with an argument list by design
    "S608",   # SQL built from fixed column lists, never from user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]  # random is fine for fuzzing fixtures
