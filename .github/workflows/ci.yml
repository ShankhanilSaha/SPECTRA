name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # CI-only FFmpeg for the remux tests. The product will bundle a pinned LGPL build
      # (NFR-16); this distro build is never shipped.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # `ml` brings in OpenCV so the motion parity test runs against the reference.
      - name: Install
        run: python -m pip install -e ".[dev,ewf,ml]"
      - name: Lint
        run: ruff check spectra tests
      - name: Test
        run: pytest -ra
